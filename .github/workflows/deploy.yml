name: Deploy to GitHub Pages

on:
  push:
    branches: [ thanuish-portfolio, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci is strict: it fails outright on any lockfile or platform
      # resolution mismatch. Nothing in the Vite build needs sharp or
      # gltf-transform (they are only used by scripts/compress.js, and the
      # compressed assets are already committed), so a tolerant install is
      # both safer here and considerably faster.
      - run: npm install --no-audit --no-fund

      # VITE_COMPRESSED makes the build load the ktx textures and the
      # -compressed glb models that are committed alongside the raw ones.
      # Same world, far smaller download.
      - run: npm run build
        env:
          VITE_COMPRESSED: 1
          VITE_MUSIC: 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
